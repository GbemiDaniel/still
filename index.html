<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050407" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Still. One warm light that breathes with you. A calm breathing guide and breath timer." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Still" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Still</title>
    <style>
      :root {
        --bg: #050407;
        --ink: rgba(243, 230, 214, .88);
        --ink-soft: rgba(243, 230, 214, .68);
        --line-edge: rgba(243, 230, 214, .26);
        --warm: #ffd9b0;
        --serif: 'Cormorant Garamond', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
        --sans: 'Jost', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
        /* Where the line's bottom edge sits above the screen's bottom edge. Leaves the controls room on short phones. */
        --line-bottom: calc(max(18svh, 164px) + env(safe-area-inset-bottom));
        --ease: cubic-bezier(.3, 0, .2, 1);
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100svh; overflow: hidden; overscroll-behavior: none;
        background: var(--bg); color: var(--ink);
        -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
        -webkit-user-select: none; user-select: none; touch-action: none; cursor: default;
        -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility; font-synthesis: none;
      }
      /* Fixed to the visible viewport, so the field's centre is the screen's centre whatever the browser bars do. */
      canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; opacity: 0; }
      .no-gl body {
        background:
          radial-gradient(circle at 50% 50%, #ffe2bf 0, #f39a4f 4%, rgba(160, 70, 25, .35) 16%, rgba(5, 4, 7, 0) 48%),
          var(--bg);
      }
      .no-gl canvas { display: none; }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
      :focus-visible { outline: 2px solid var(--warm); outline-offset: 3px; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

      /* ---- The voice: Cormorant Garamond Light Italic, one line at a time ---- */
      #line, #hint {
        position: fixed; left: 0; right: 0;
        padding: 0 28px; text-align: center; pointer-events: none;
        font-family: var(--serif); font-style: italic; font-weight: 300;
        letter-spacing: .045em; line-height: 1.22; text-wrap: balance;
        font-kerning: normal; font-variant-ligatures: common-ligatures;
      }
      #line { bottom: var(--line-bottom); }
      #line, #hint { opacity: 0; transition: opacity 2.6s var(--ease); }
      #line.on { opacity: 1; }
      /* Two spans share one cell and cross-fade, so the line never shifts. */
      #line { display: grid; font-size: clamp(23px, 6vw, 36px); color: var(--ink); }
      #line span { grid-area: 1 / 1; opacity: 0; transition: opacity 1.1s cubic-bezier(.4, 0, .2, 1); }
      #line span.on { opacity: 1; transition-delay: .35s; transition-duration: 1.6s; }
      /* Its own layer, below the line, so its fade never repaints the line. */
      #hint {
        top: calc(100svh - var(--line-bottom) + 1.15em);
        font-size: clamp(14px, 3.7vw, 18px); letter-spacing: .14em; color: var(--ink-soft);
      }
      #hint.on { opacity: 1; transition-duration: 3.2s; }
      /*
        Timer readout: its own band at the top, below the notch and the options button. The light
        is centred and never reaches here with any brightness, and a thumb holding lower down does
        not cover it. A soft dark backing keeps it readable even at the fullest breath. Steady-width
        digits (tabular, padded with figure spaces) so nothing shifts as the numbers change.
      */
      #count {
        position: fixed; z-index: 2; left: 50%; top: calc(env(safe-area-inset-top) + 64px);
        transform: translateX(-50%); padding: 6px 18px; pointer-events: none; white-space: pre;
        font-family: var(--sans); font-weight: 400; font-size: clamp(44px, 12vw, 60px); line-height: 1;
        letter-spacing: .04em; font-variant-numeric: tabular-nums lining-nums; color: #fff6ec;
        text-shadow: 0 0 14px rgba(5, 4, 7, .55);
        opacity: 0; transition: opacity .8s var(--ease);
      }
      #count::before {
        content: ''; position: absolute; z-index: -1; inset: -34px -60px;
        background: radial-gradient(closest-side, rgba(5, 4, 7, .5), rgba(5, 4, 7, .24) 55%, rgba(5, 4, 7, 0));
      }
      #count.on { opacity: 1; }
      #count small { font-size: .36em; letter-spacing: .12em; margin-left: .3em; color: rgba(255, 246, 236, .78); }
      #count .dots { font-size: .5em; letter-spacing: .5em; margin-right: -.5em; }

      #progress {
        position: fixed; left: 0; right: 0; top: env(safe-area-inset-top); height: 2px;
        pointer-events: none; opacity: 0; transition: opacity 1.2s var(--ease);
      }
      #progress i { display: block; height: 100%; background: rgba(255, 190, 130, .62); transform-origin: 0 50%; transform: scaleX(0); }
      #progress.on { opacity: 1; }

      /* ---- The tools: Jost, quiet, large to touch ---- */
      #ui { opacity: 0; transition: opacity 1.6s var(--ease); font-family: var(--sans); font-weight: 400; }
      #ui.on { opacity: 1; }

      #gear {
        position: fixed; z-index: 3;
        top: calc(env(safe-area-inset-top) + 6px); right: calc(env(safe-area-inset-right) + 6px);
        width: 52px; height: 52px; display: grid; place-items: center; border-radius: 50%;
        color: var(--ink-soft); transition: color .3s, opacity 1s var(--ease);
      }
      #gear:active { color: var(--ink); }
      #gear svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; }
      [data-scene*="-run"] #gear, [data-scene="timer-in"] #gear, [data-scene="timer-hold"] #gear, [data-scene="timer-out"] #gear { opacity: .55; }

      #bottom {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; pointer-events: none;
        padding: 0 20px calc(env(safe-area-inset-bottom) + 10px);
        display: flex; flex-direction: column; align-items: center;
      }
      #bottom::before {
        content: ''; position: absolute; inset: -56px 0 0; z-index: -1; pointer-events: none;
        background: linear-gradient(to bottom, rgba(5, 4, 7, 0), rgba(5, 4, 7, .82) 38%, rgba(5, 4, 7, .94));
        opacity: 0; transition: opacity 1s var(--ease);
      }
      [data-scene$="setup"] #bottom::before, [data-scene="timer-result"] #bottom::before, [data-scene="guided-found"] #bottom::before { opacity: 1; }
      #bottom > * { width: 100%; max-width: 440px; }

      /* Panes share one cell; only the current one shows and takes focus (inert is set from script). */
      #panel { display: grid; }
      .pane {
        grid-area: 1 / 1; align-self: end; display: flex; flex-direction: column; gap: 12px;
        opacity: 0; visibility: hidden; transition: opacity .6s var(--ease), visibility 0s .6s;
      }
      .pane.on { opacity: 1; visibility: visible; transition: opacity .9s var(--ease) .15s, visibility 0s; }
      .note { text-align: center; font-size: 15px; letter-spacing: .06em; color: var(--ink-soft); line-height: 1.45; padding: 0 12px; text-wrap: balance; }

      .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .chip {
        pointer-events: auto; min-height: 56px; border-radius: 16px; border: 1px solid var(--line-edge);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
        font-size: 16px; letter-spacing: .06em; color: var(--ink-soft);
        transition: color .3s, border-color .3s, background-color .3s;
      }
      .chip small { font-size: 12.5px; letter-spacing: .04em; opacity: .9; }
      .chips.small .chip { min-height: 48px; border-radius: 14px; }
      .chip.wide { min-height: 58px; flex-direction: row; justify-content: space-between; padding: 0 20px; gap: 12px; color: var(--ink); }
      .chip.wide .name { font-size: 17px; letter-spacing: .08em; }
      .chip.wide .detail { font-size: 14px; letter-spacing: .04em; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
      .chip.wide .detail::after { content: ''; display: inline-block; width: 6px; height: 6px; margin-left: 10px; border: solid currentColor; border-width: 1.5px 1.5px 0 0; transform: rotate(45deg) translateY(-2px); }
      .row { display: flex; gap: 12px; }
      .row .btn { flex: 1 1 0; min-width: 0; }
      .row .btn.quiet { flex: 0 0 auto; }
      .chip[aria-pressed="true"] { color: #fbeadb; border-color: rgba(255, 196, 140, .62); background: rgba(255, 170, 100, .12); }
      .chip:active { background: rgba(255, 170, 100, .18); }

      .btn {
        pointer-events: auto; min-height: 54px; min-width: 112px; padding: 0 28px; border-radius: 999px;
        border: 1px solid var(--line-edge); font-size: 17px; letter-spacing: .1em; color: var(--ink);
        transition: background-color .3s, border-color .3s, opacity .3s;
      }
      .btn.primary { border-color: rgba(255, 196, 140, .6); background: rgba(255, 170, 100, .14); color: #fdeee0; }
      .btn.quiet { border-color: transparent; color: var(--ink-soft); min-width: 84px; padding: 0 18px; }
      .btn:active { background: rgba(255, 170, 100, .22); }
      .pane > .btn { align-self: center; width: 100%; }

      /* Tabs and the session's buttons share one row, so the notice below stays in view in every scene. */
      #dock { display: grid; }
      #dock > * { grid-area: 1 / 1; }
      #actions {
        display: flex; justify-content: center; align-items: center; gap: 12px; min-height: 54px;
        opacity: 0; visibility: hidden; transition: opacity .7s var(--ease), visibility 0s .7s;
      }
      #actions.on { opacity: 1; visibility: visible; transition: opacity 1s var(--ease), visibility 0s; }
      [data-scene="guided-end"] #actions.on, [data-scene="timer-result"] #actions.on { transition-delay: 2.6s, 0s; }
      /* Buttons size to their words and share what is left, so "breathe out" never wraps beside "hold". */
      #actions .btn { flex: 1 1 auto; min-width: 0; padding: 0 16px; white-space: nowrap; }
      #actions .btn.quiet { flex: 0 0 auto; padding: 0 14px; }

      #tabs {
        display: grid; grid-template-columns: repeat(3, 1fr); pointer-events: none;
        opacity: 1; visibility: visible; transition: opacity 1s var(--ease) .2s, visibility 0s;
      }
      #tabs.away { opacity: 0; visibility: hidden; transition: opacity .6s var(--ease), visibility 0s .6s; }
      #tabs button {
        pointer-events: auto; min-height: 52px; font-size: 16px; letter-spacing: .12em;
        color: var(--ink-soft); position: relative; transition: color .4s;
      }
      #tabs button::after {
        content: ''; position: absolute; left: 50%; bottom: 8px; width: 4px; height: 4px; margin-left: -2px;
        border-radius: 50%; background: var(--warm); opacity: 0; transition: opacity .4s;
      }
      #tabs button[aria-current="true"] { color: #fbeadb; }
      #tabs button[aria-current="true"]::after { opacity: .9; }
      #notice .dizzy { display: none; }
      [data-scene^="guided"] #notice .dizzy { display: block; }
      #notice {
        text-align: center; font-size: 13px; letter-spacing: .04em; line-height: 1.35; color: var(--ink-soft);
        padding: 8px 8px 0; transition: opacity 1s var(--ease);
      }

      /* Timer result and found pace */
      .result { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; padding-bottom: 4px; }
      .result div { display: flex; flex-direction: column; gap: 4px; }
      .result dt { font-size: 13px; letter-spacing: .14em; color: var(--ink-soft); order: 2; }
      .result dd { font-size: clamp(26px, 7vw, 34px); letter-spacing: .04em; font-variant-numeric: tabular-nums lining-nums; color: var(--ink); }
      .result dd small { font-size: .5em; margin-left: .25em; color: var(--ink-soft); letter-spacing: .1em; }

      /* ---- Options sheet ---- */
      .sheet {
        position: fixed; inset: 0; z-index: 5; display: flex; align-items: flex-end; justify-content: center;
        background: rgba(5, 4, 7, .72); opacity: 0; visibility: hidden;
        transition: opacity .5s var(--ease), visibility 0s .5s;
        font-family: var(--sans); touch-action: manipulation;
      }
      .sheet.open { opacity: 1; visibility: visible; transition: opacity .5s var(--ease), visibility 0s; }
      .sheet .card {
        width: 100%; max-width: 480px; padding: 22px 22px calc(env(safe-area-inset-bottom) + 18px);
        background: #0c0910; border: 1px solid var(--line-edge); border-bottom: 0; border-radius: 24px 24px 0 0;
        display: flex; flex-direction: column; gap: 6px;
      }
      .sheet h2 { font-family: var(--serif); font-style: italic; font-weight: 300; font-size: 28px; letter-spacing: .045em; margin-bottom: 6px; }
      .switch {
        display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left;
        min-height: 64px; padding: 6px 2px; border-top: 1px solid rgba(243, 230, 214, .12);
      }
      .switch .t { display: flex; flex-direction: column; gap: 3px; }
      .switch b { font-weight: 400; font-size: 17px; letter-spacing: .06em; color: var(--ink); }
      .switch i { font-style: normal; font-size: 13.5px; letter-spacing: .03em; color: var(--ink-soft); }
      .knob { flex: none; width: 52px; height: 32px; border-radius: 16px; border: 1px solid var(--line-edge); position: relative; transition: background-color .3s, border-color .3s; }
      .knob::after {
        content: ''; position: absolute; left: 4px; top: 4px; width: 22px; height: 22px; border-radius: 50%;
        background: var(--ink-soft); transition: transform .3s var(--ease), background-color .3s;
      }
      .switch[aria-checked="true"] .knob { background: rgba(255, 170, 100, .22); border-color: rgba(255, 196, 140, .62); }
      .switch[aria-checked="true"] .knob::after { transform: translateX(20px); background: var(--warm); }
      .sheet .small { font-size: 13.5px; letter-spacing: .03em; line-height: 1.5; color: var(--ink-soft); padding: 10px 2px 0; border-top: 1px solid rgba(243, 230, 214, .12); }
      .sheet .small + .small { border-top: 0; padding-top: 4px; }
      /* Short screens: the card scrolls inside itself rather than running off the top. */
      .sheet .card { max-height: calc(100svh - 16px); overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; }
      .sheet .row { margin-top: 12px; }
      .sheet .card > .btn { align-self: stretch; margin-top: 12px; }
      #presets { margin-bottom: 4px; }
      #presets .chip { min-height: 48px; }
      .steppers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 4px; }
      .stepper {
        border: 1px solid rgba(243, 230, 214, .14); border-radius: 16px; padding: 8px 4px 4px;
        display: flex; flex-direction: column; align-items: center; gap: 0;
      }
      .stepper .lab { font-size: 14px; letter-spacing: .06em; color: var(--ink-soft); }
      .stepper .lab i { font-style: normal; font-size: 12.5px; opacity: .85; }
      .stepper .ctl { display: flex; align-items: center; justify-content: space-between; width: 100%; }
      .stepper button {
        width: 48px; height: 48px; border-radius: 50%; font-size: 22px; line-height: 1; color: var(--ink);
        display: grid; place-items: center; transition: background-color .3s, opacity .3s;
      }
      .stepper button:active { background: rgba(255, 170, 100, .18); }
      .stepper button:disabled { opacity: .38; cursor: default; }
      .stepper output { font-size: 21px; letter-spacing: .04em; font-variant-numeric: tabular-nums lining-nums; color: var(--ink); }

      /* Short phones: the guided notice runs to three lines, so tighten the panel to keep it clear of the light. Targets stay 48 px or more. */
      @media (max-height: 700px) {
        .pane { gap: 8px; }
        .chip.wide { min-height: 50px; }
        .btn { min-height: 50px; }
        #tabs button { min-height: 48px; }
        #notice { font-size: 12px; letter-spacing: .02em; line-height: 1.3; }
      }
      /* ---- Calm: slower fades, nothing that moves ---- */
      .calm #line span.on { transition-duration: 2.6s; }
      .calm #line span { transition-duration: 1.8s; }
      .calm .pane.on, .calm #actions.on, .calm #ui { transition-duration: 1.6s; }
      .calm .knob::after { transition-duration: .01s; }
    </style>
  </head>
  <body>
    <canvas id="c" aria-hidden="true"></canvas>
    <p id="line" aria-hidden="true"><span class="on">breathe with the light</span><span></span></p>
    <p id="hint" aria-hidden="true"></p>
    <div id="count" role="timer" aria-live="off" aria-atomic="true"><span id="count-face" aria-hidden="true"></span><span id="count-text" class="sr"></span></div>
    <div id="progress" aria-hidden="true"><i></i></div>
    <p id="status" class="sr" role="status" aria-live="polite"></p>

    <div id="ui" data-scene="free">
      <button id="gear" type="button" aria-haspopup="dialog" aria-controls="sheet" aria-expanded="false" aria-label="options">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>
      </button>

      <div id="bottom">
        <div id="panel">
          <section class="pane" data-pane="guided-setup" aria-label="guided breathing">
            <button class="chip wide" id="pace-open" type="button" aria-haspopup="dialog" aria-controls="pace-sheet">
              <span class="name"></span><small class="detail"></small>
            </button>
            <div class="chips small" id="lengths" role="group" aria-label="length"></div>
            <div class="row">
              <button class="btn quiet" id="find-pace" type="button"></button>
              <button class="btn primary" id="begin-guided" type="button"></button>
            </div>
          </section>
          <section class="pane" data-pane="guided-found" aria-label="your starting pace">
            <p class="note" id="found-note"></p>
            <dl class="result" id="found"></dl>
          </section>
          <section class="pane" data-pane="timer-setup" aria-label="breath timer">
            <p class="note" id="timer-note"></p>
            <button class="btn primary" id="begin-timer" type="button"></button>
          </section>
          <section class="pane" data-pane="timer-result" aria-label="your breath">
            <dl class="result" id="result"></dl>
          </section>
        </div>
        <div id="dock">
          <div id="actions" role="group"></div>
          <nav id="tabs" aria-label="mode"></nav>
        </div>
        <p id="notice"></p>
      </div>
    </div>

    <div id="pace-sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="pace-title" data-ui inert>
      <div class="card">
        <h2 id="pace-title"></h2>
        <div class="chips" id="presets" role="group" aria-label="starting points"></div>
        <div class="steppers" id="steppers"></div>
        <p class="small" id="cycle"></p>
        <p class="small" id="pace-dizzy"></p>
        <div class="row">
          <button class="btn quiet" id="pace-find" type="button"></button>
          <button class="btn primary" id="pace-done" type="button"></button>
        </div>
      </div>
    </div>

    <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" data-ui inert>
      <div class="card">
        <h2 id="sheet-title"></h2>
        <button class="switch" id="sw-sound" type="button" role="switch" aria-checked="false">
          <span class="t"><b></b><i></i></span><span class="knob"></span>
        </button>
        <button class="switch" id="sw-vibe" type="button" role="switch" aria-checked="false">
          <span class="t"><b></b><i></i></span><span class="knob"></span>
        </button>
        <button class="switch" id="sw-awake" type="button" role="switch" aria-checked="true">
          <span class="t"><b></b><i></i></span><span class="knob"></span>
        </button>
        <p class="small" id="privacy"></p>
        <p class="small" id="notice-long"></p>
        <div class="row">
          <button class="btn quiet" id="forget" type="button"></button>
          <button class="btn" id="sheet-close" type="button"></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
