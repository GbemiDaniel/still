<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050407" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Still. One warm light that breathes with you." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Still</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100svh; overflow: hidden; overscroll-behavior: none;
        background: #050407; color: #f3e6d6;
        -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none;
        -webkit-user-select: none; user-select: none; touch-action: none; cursor: default;
      }
      /* Fixed to the visible viewport, so the field's centre is the screen's centre whatever the browser bars do. */
      canvas { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; opacity: 0; }
      .no-gl body {
        background:
          radial-gradient(circle at 50% 50%, #ffe2bf 0, #f39a4f 4%, rgba(160, 70, 25, .35) 16%, rgba(5, 4, 7, 0) 48%),
          #050407;
      }
      .no-gl canvas { display: none; }
      #line, #hint {
        position: fixed; left: 0; right: 0;
        padding: 0 24px; text-align: center; pointer-events: none;
        font-family: 'Cormorant Garamond', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
        font-style: italic; font-weight: 300; letter-spacing: .045em; line-height: 1.2;
      }
      #line { bottom: calc(17svh + env(safe-area-inset-bottom)); }
      #line, #hint { opacity: 0; transition: opacity 2.6s cubic-bezier(.3, 0, .2, 1); }
      #line.on { opacity: 1; }
      /* The phrases share one cell and cross-fade, so the line never shifts. */
      #line { display: grid; font-size: clamp(21px, 5.6vw, 34px); color: rgba(243, 230, 214, .84); }
      #line span { grid-area: 1 / 1; opacity: 0; transition: opacity 1.1s cubic-bezier(.4, 0, .2, 1); }
      #line span.on { opacity: 1; transition-delay: .35s; transition-duration: 1.6s; }
      /* Its own layer, below the line, so its fade never repaints the line. */
      #hint {
        top: calc(83svh - env(safe-area-inset-bottom) + 1.1em);
        font-size: clamp(14px, 3.7vw, 18px); letter-spacing: .14em; color: rgba(243, 230, 214, .5);
      }
      #hint.on { opacity: 1; transition-duration: 3.2s; }
    </style>
  </head>
  <body>
    <canvas id="c" aria-hidden="true"></canvas>
    <p id="line">
      <span data-mode="rest" class="on">breathe with the light</span>
      <span data-mode="in" aria-hidden="true">breathe in</span>
      <span data-mode="out" aria-hidden="true">breathe out</span>
    </p>
    <p id="hint"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
